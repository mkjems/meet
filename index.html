<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1014" />
  <title>Meet: video calls with friends, no sign-up</title>
  <meta name="description" content="Video calls for up to four people, right in the browser. Share a link, talk, share your screen. No sign-up." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="M. Kjems" />
  <meta property="og:title" content="Meet" />
  <meta property="og:description" content="Video calls for up to four people, right in the browser. No sign-up." />
  <meta property="og:url" content="https://meet.mkjems.dk/" />
  <meta property="og:image" content="https://meet.mkjems.dk/og.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="628" />
  <meta property="og:image:alt" content="Meet: a video call with four smiling people in a grid, and the words: Video calls for up to four. No sign-up." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="robots" content="noindex" />
  <script>
    // Meeting codes are not counted: every meeting is "/room".
    window.goatcounter = { path: (p) => location.host + (p === "/" ? "/" : "/room"), no_onload: location.hostname !== "meet.mkjems.dk" };
  </script>
  <script data-goatcounter="https://stats.mkjems.dk/count" async src="//stats.mkjems.dk/count.js"></script>
</head>

<body>
  <!-- Start or join a meeting. -->
  <section id="home" class="screen center" hidden>
    <div class="card">
      <h1 class="logo"><span class="mark" aria-hidden="true"></span>Meet</h1>
      <p class="lead">Video calls for up to four people, straight from the browser. No sign-up.</p>
      <button id="b-new" class="primary big">New meeting</button>
      <div class="or"><span>or join one</span></div>
      <form id="f-join" class="row">
        <input id="join-code" placeholder="Code or link" autocomplete="off" spellcheck="false" aria-label="Meeting code or link">
        <button type="submit">Join</button>
      </form>
    </div>
  </section>

  <!-- Check your camera and mic, pick a name, then join. -->
  <section id="lobby" class="screen center" hidden>
    <div class="lobby">
      <div class="preview tile self">
        <video id="lobby-video" autoplay playsinline muted></video>
        <div class="avatar"><span id="lobby-initials"></span></div>
        <div class="preview-bar">
          <button id="lb-mic" class="round" aria-pressed="true" title="Microphone"></button>
          <button id="lb-cam" class="round" aria-pressed="true" title="Camera"></button>
        </div>
        <div class="meter" aria-hidden="true"><span id="lobby-meter"></span></div>
      </div>
      <div class="card side">
        <h2>Ready to join?</h2>
        <p id="lobby-who" class="muted">&nbsp;</p>
        <label class="field">Your name
          <input id="name" maxlength="40" autocomplete="name" spellcheck="false" placeholder="What the others see">
        </label>
        <label class="field">Microphone <select id="sel-mic"></select></label>
        <label class="field">Camera <select id="sel-cam"></select></label>
        <p id="lobby-error" class="error" hidden></p>
        <button id="b-join" class="primary big">Join now</button>
        <div class="row link-row">
          <input id="lobby-link" readonly aria-label="Link to this meeting">
          <button id="b-lobby-copy">Copy</button>
        </div>
      </div>
    </div>
  </section>

  <!-- The meeting. -->
  <section id="call" class="screen" hidden>
    <div class="call-main">
      <div id="tiles" class="tiles"></div>
      <aside id="chat" class="chat" hidden>
        <header><h2>Chat</h2><button id="b-chat-close" class="icon" title="Close" aria-label="Close chat"></button></header>
        <ol id="chat-list" class="chat-list" aria-live="polite"></ol>
        <form id="f-chat" class="chat-form">
          <textarea id="chat-input" rows="1" placeholder="Message everyone" maxlength="2000" aria-label="Message"></textarea>
          <button type="submit" class="icon" id="b-send" title="Send" aria-label="Send"></button>
        </form>
      </aside>
    </div>
    <footer class="controls">
      <div class="left">
        <span id="clock" class="clock"></span>
        <span id="offline" class="offline" hidden>Reconnecting…</span>
      </div>
      <div class="mid">
        <button id="b-mic" class="round" title="Microphone (M)"></button>
        <button id="b-cam" class="round" title="Camera (V)"></button>
        <button id="b-screen" class="round" title="Share your screen"></button>
        <button id="b-chat" class="round" title="Chat"><span id="unread" class="badge" hidden></span></button>
        <button id="b-invite" class="round" title="Copy the invite link"></button>
        <button id="b-settings" class="round" title="Devices"></button>
        <button id="b-leave" class="round danger wide" title="Leave"></button>
      </div>
      <div class="right"><span id="people" class="people"></span></div>
    </footer>
    <div id="settings" class="popover" hidden>
      <label class="field">Microphone <select id="set-mic"></select></label>
      <label class="field">Camera <select id="set-cam"></select></label>
    </div>
  </section>

  <!-- After leaving, or turned away. -->
  <section id="ended" class="screen center" hidden>
    <div class="card">
      <h1 id="ended-title">You left the meeting</h1>
      <p id="ended-text" class="muted"></p>
      <button id="b-rejoin" class="primary big">Rejoin</button>
      <button id="b-home">New meeting</button>
    </div>
  </section>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
